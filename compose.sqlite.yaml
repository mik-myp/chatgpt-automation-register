name: gpt-auto-register-sqlite

x-app: &app
  image: mikmyp/chatgpt-automation-register:latest
  restart: unless-stopped
  environment:
    GPT_AUTO_ENVIRONMENT: production
    GPT_AUTO_DATABASE_URL: sqlite+pysqlite:////app/data/gpt-auto-register.db
    GPT_AUTO_HOST: 0.0.0.0
  volumes:
    - app-data:/app/data

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["gpt-auto-migrate"]

  api:
    <<: *app
    command: ["gpt-auto-api"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["gpt-auto-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  app-data:
