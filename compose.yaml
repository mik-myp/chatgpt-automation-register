name: gpt-auto-register

x-app: &app
  image: mikmyp/chatgpt-automation-register:latest
  restart: unless-stopped
  environment: &app-environment
    GPT_AUTO_ENVIRONMENT: production
    GPT_AUTO_DATABASE_URL: postgresql+psycopg://gpt_auto:123456@database:5432/gpt_auto
    GPT_AUTO_HOST: 0.0.0.0
  volumes:
    - app-data:/app/data

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpt_auto
      POSTGRES_USER: gpt_auto
      POSTGRES_PASSWORD: "123456"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpt_auto -d gpt_auto"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["gpt-auto-migrate"]
    depends_on:
      database:
        condition: service_healthy

  api:
    <<: *app
    command: ["gpt-auto-api"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["gpt-auto-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  app-data:
  postgres-data:
