name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:api

      - name: Verify migrations from an empty database
        working-directory: apps/api
        env:
          GPT_AUTO_DATABASE_URL: sqlite+pysqlite:////tmp/gpt-auto-register-ci.db
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Verify generated API client
        working-directory: apps/api
        env:
          GPT_AUTO_DATABASE_URL: sqlite+pysqlite:////tmp/gpt-auto-register-ci.db
        run: |
          .venv/bin/uvicorn gpt_auto_register.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          cd ../..
          pnpm api:generate
          git diff --exit-code -- apps/web/src/api/generated.ts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
