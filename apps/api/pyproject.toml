[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-auto-register-api"
version = "0.3.2"
description = "Local API and worker runtime for GPT Auto Register"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "curl-cffi>=0.7,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "PySocks>=1.7.1,<2",
  "pyotp>=2.9,<3",
  "requests>=2.31,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
gpt-auto-api = "gpt_auto_register.entrypoints.api:main"
gpt-auto-worker = "gpt_auto_register.entrypoints.worker:main"
gpt-auto-migrate = "gpt_auto_register.entrypoints.migrate:main"
gpt-auto-cli = "gpt_auto_register.entrypoints.cli:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gpt_auto_register.runtime" = ["*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = [
  "src/gpt_auto_register/runtime/auth_flow.py",
  "src/gpt_auto_register/runtime/config.py",
  "src/gpt_auto_register/runtime/fingerprint.py",
  "src/gpt_auto_register/runtime/http_client.py",
  "src/gpt_auto_register/runtime/mail_cf.py",
  "src/gpt_auto_register/runtime/mail_outlook.py",
  "src/gpt_auto_register/runtime/sms_provider.py",
  "src/gpt_auto_register/runtime/webui/",
  "src/gpt_auto_register/worker/legacy_runner.py",
]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "curl_cffi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mail_cf", "sentinel", "sentinel_quickjs"]
ignore_missing_imports = true
